 font-family: 'Patrick Hand', cursive;

<script>
(function () {
  var canvas = document.getElementById('atmosphere-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var coarse = matchMedia('(pointer:coarse)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var NOTES = ['♪','♫','♩','♬','♭','♮'];

  function readAccent() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return v || '#1E90FF';
  }
  function readAccentRgb() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim();
    return v || '30,144,255';
  }
  var accent = readAccent();
  var accentRgb = readAccentRgb();

  var W = 0, H = 0;
  function resize() {
    W = canvas.width  = Math.floor(innerWidth  * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize, { passive: true });

  // ─── Ambient dust particles ──────────────────────────────────
  var COUNT = reduce ? 22 : (coarse ? 30 : 60);
  var particles = [];
  for (var i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      glyph: NOTES[Math.floor(Math.random() * NOTES.length)],
      size: (12 + Math.random() * 8.5) * dpr,
      vx: (Math.random() - 0.5) * 0.4 * dpr,
      vy: (Math.random() - 0.5) * 0.4 * dpr,
      opacity: 0.13 + Math.random() * 0.17,
      rotation: (Math.random() - 0.5) * 0.6,
      // displacement offset from natural drift — decays back to 0 (spring-back)
      ox: 0, oy: 0,
    });
  }

  var mouseX = -9999, mouseY = -9999;
  var lastSpawnX = 0, lastSpawnY = 0;
  var spotlight = document.getElementById('cursor-spotlight');

  // ─── Cursor trail (musical notes that fade behind cursor) ────
  var trail = [];
  function spawnTrail(x, y) {
    if (reduce || coarse) return;
    trail.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 0.6 * dpr,
      vy: 0.2 * dpr + Math.random() * 0.4 * dpr,
      spawnedAt: performance.now(),
      maxLife: 1300 + Math.random() * 600,
      glyph: NOTES[Math.floor(Math.random() * NOTES.length)],
      size: (10 + Math.random() * 4) * dpr,
      rot: (Math.random() - 0.5) * 0.5,
    });
  }

  if (!reduce && !coarse) {
    addEventListener('mousemove', function (e) {
      mouseX = e.clientX * dpr;
      mouseY = e.clientY * dpr;
      // Spotlight follows cursor (transform on the div)
      if (spotlight) {
        spotlight.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
        spotlight.style.opacity = '1';
      }
      // Rate-limit trail spawns by distance moved (every ~70 css px)
      var dxs = e.clientX - lastSpawnX, dys = e.clientY - lastSpawnY;
      if (dxs * dxs + dys * dys > 70 * 70) {
        spawnTrail(mouseX, mouseY);
        lastSpawnX = e.clientX;
        lastSpawnY = e.clientY;
      }
    }, { passive: true });
    addEventListener('mouseleave', function () {
      mouseX = mouseY = -9999;
      if (spotlight) spotlight.style.opacity = '0';
    }, { passive: true });
  }

  var REPULSE_RADIUS = 300 * dpr;
  var REPULSE_STRENGTH = reduce ? 0 : 3.2;

  var running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) requestAnimationFrame(loop);
  });

  var accentTick = 0;
  function loop() {
    if (!running) return;
    if ((accentTick++ & 31) === 0) {
      accent = readAccent();
      accentRgb = readAccentRgb();
      if (spotlight) {
        spotlight.style.background =
          'radial-gradient(circle, rgba(' + accentRgb + ',0.10) 0%, rgba(' + accentRgb + ',0.04) 28%, transparent 65%)';
      }
    }
    ctx.clearRect(0, 0, W, H);

    // ambient dust
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      // Natural drift along the home path
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -24) p.x = W + 24;
      if (p.x > W + 24) p.x = -24;
      if (p.y < -24) p.y = H + 24;
      if (p.y > H + 24) p.y = -24;
      // Composite position = home path + cursor displacement
      var fx = p.x + p.ox, fy = p.y + p.oy;
      // Cursor repulse — accumulates into displacement offset, not position
      var dx = fx - mouseX, dy = fy - mouseY;
      var dist2 = dx * dx + dy * dy;
      var r2 = REPULSE_RADIUS * REPULSE_RADIUS;
      if (dist2 < r2 && dist2 > 1) {
        var dist = Math.sqrt(dist2);
        var force = (1 - dist / REPULSE_RADIUS) * REPULSE_STRENGTH;
        p.ox += (dx / dist) * force * 15;
        p.oy += (dy / dist) * force * 15;
      }
      // Spring back: damp the displacement toward 0 every frame
      p.ox *= 0.93;
      p.oy *= 0.93;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x + p.ox, p.y + p.oy);
      ctx.rotate(p.rotation);
      ctx.fillStyle = accent;
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.glyph, 0, 0);
      ctx.restore();
    }

    // cursor trail — very low opacity, fades over lifetime
    var now = performance.now();
    for (var b = trail.length - 1; b >= 0; b--) {
      var tp = trail[b];
      var age = now - tp.spawnedAt;

// ─── Slam-bubble hover: cards in horizontal rows push siblings outward ───
(function () {
  var coarse = matchMedia('(pointer:coarse)').matches;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (coarse || reduce) return;

  function initRow(row, opts) {
    opts = opts || {};
    var scale     = opts.scale     || 1.18;
    var pushBase  = opts.pushBase  || 28;
    var falloff   = opts.falloff   || 8;
    var shrinkPer = opts.shrinkPer || 0.025;
    var minShrink = opts.minShrink || 0.88;
    var skipDisabled = opts.skipDisabled || false;

    var cards = Array.prototype.slice.call(row.children).filter(function (el) {
      if (el.tagName !== 'A' && el.tagName !== 'DIV' && el.tagName !== 'SPAN') return false;
      if (skipDisabled && el.classList.contains('disabled')) return false;
      return true;
    });
    cards.forEach(function (card, i) {
      card.style.transition = 'transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1)';
      card.addEventListener('mouseenter', function () {
        cards.forEach(function (other, j) {
          if (j === i) {
            other.style.transform = 'scale(' + scale + ')';
            other.style.zIndex = '10';
          } else {
            var dir = j > i ? 1 : -1;
            var dist = Math.abs(j - i);
            var pushPx = dir * Math.max(0, pushBase - (dist - 1) * falloff);
            var shrink = Math.max(minShrink, 1 - dist * shrinkPer);
            other.style.transform = 'translateX(' + pushPx + 'px) scale(' + shrink + ')';
            other.style.zIndex = '';
          }
        });
      });
      card.addEventListener('mouseleave', function () {
        cards.forEach(function (c) { c.style.transform = ''; c.style.zIndex = ''; });
      });
    });
  }

  // Grid: group cards into visual rows (by Y-center), then apply
  // the same horizontal-domino push as homepage rows within each row.
  function initGrid(grid) {
    var cards = Array.prototype.slice.call(grid.children).filter(function (el) {
      return el.tagName === 'A' || el.tagName === 'DIV' || el.tagName === 'SPAN';
    });
    function refreshRows() {
      var rows = [];
      cards.forEach(function (c) {
        var r = c.getBoundingClientRect();
        var cy = r.top + r.height / 2;
        var bucket = rows.find(function (row) { return Math.abs(row.y - cy) < r.height / 2; });
        if (bucket) bucket.items.push(c);
        else rows.push({ y: cy, items: [c] });
      });
      cards.forEach(function (c) { c._slamRow = null; });
      rows.forEach(function (r) {
        var sorted = r.items.sort(function (a, b) {
          return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
        });
        sorted.forEach(function (c) { c._slamRow = sorted; });
      });
    }
    cards.forEach(function (c) {
      c.style.transition = 'transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1)';
      c.addEventListener('mouseenter', function () {
        var row = c._slamRow;
        if (!row) return;
        var i = row.indexOf(c);
        row.forEach(function (other, j) {
          if (j === i) {
            other.style.transform = 'scale(1.18)';
            other.style.zIndex = '10';
          } else {
            var dir = j > i ? 1 : -1;
            var dist = Math.abs(j - i);
            var pushPx = dir * Math.max(0, 28 - (dist - 1) * 8);
            var shrink = Math.max(0.88, 1 - dist * 0.025);
            other.style.transform = 'translateX(' + pushPx + 'px) scale(' + shrink + ')';
            other.style.zIndex = '';
          }
        });
      });
      c.addEventListener('mouseleave', function () {
        var row = c._slamRow;
        if (row) row.forEach(function (o) { o.style.transform = ''; o.style.zIndex = ''; });
      });
    });
    refreshRows();
    addEventListener('resize', refreshRows, { passive: true });
  }

  function init() {
    document.querySelectorAll('.album-row, .series-row').forEach(function (r) { initRow(r); });
    document.querySelectorAll('.nav-links').forEach(function (r) {
      initRow(r, { scale: 1.28, pushBase: 18, falloff: 5, shrinkPer: 0.02, minShrink: 0.9, skipDisabled: true });
    });
    document.querySelectorAll('.nav-ctas').forEach(function (r) {
      initRow(r, { scale: 1.18, pushBase: 12, falloff: 4, shrinkPer: 0.02, minShrink: 0.92 });
    });
    document.querySelectorAll('.grid').forEach(function (g) { initGrid(g); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

      svg: '<svg viewBox="0 0 16 16" width="24" height="24" fill="#26CAFF"><path d="M10.813 11.968c.157.083.36.074.5-.05l.005.005a90 90 0 0 1 1.623-1.405c.173-.143.143-.372.006-.563l-.125-.17c-.345-.465-.673-.906-.673-1.791v-3.3l.001-.335c.008-1.265.014-2.421-.933-3.305C10.404.274 9.06 0 8.03 0C6.017 0 3.77.75 3.296 3.24c-.047.264.143.404.316.443l2.054.22c.19-.009.33-.196.366-.387c.176-.857.896-1.271 1.703-1.271c.435 0 .929.16 1.188.55c.264.39.26.91.257 1.376v.432q-.3.033-.621.065c-1.113.114-2.397.246-3.36.67C3.873 5.91 2.94 7.08 2.94 8.798c0 2.2 1.387 3.298 3.168 3.298c1.506 0 2.328-.354 3.489-1.54l.167.246c.274.405.456.675 1.047 1.166ZM6.03 8.431C6.03 6.627 7.647 6.3 9.177 6.3v.57c.001.776.002 1.434-.396 2.133c-.336.595-.87.961-1.465.961c-.812 0-1.286-.619-1.286-1.533M.435 12.174c2.629 1.603 6.698 4.084 13.183.997c.28-.116.475.078.199.431C13.538 13.96 11.312 16 7.57 16C3.832 16 .968 13.446.094 12.386c-.24-.275.036-.4.199-.299z"/><path d="M13.828 11.943c.567-.07 1.468-.027 1.645.204c.135.176-.004.966-.233 1.533c-.23.563-.572.961-.762 1.115s-.333.094-.23-.137c.105-.23.684-1.663.455-1.963c-.213-.278-1.177-.177-1.625-.13l-.09.009q-.142.013-.233.024c-.193.021-.245.027-.274-.032c-.074-.209.779-.556 1.347-.623"/></svg>'
    },
    {
      n: 'Pandora',
      url: 'https://www.pandora.com/artist/auny/AR2rwlqqccbVhhq',
      c: '#3668FF',
      svg: '<svg viewBox="0 0 24 24" width="24" height="24" fill="#3668FF"><path d="M1.882 0v24H8.32a1.085 1.085 0 001.085-1.085v-4.61h1.612c7.88 0 11.103-4.442 11.103-9.636C22.119 2.257 17.247 0 12.662 0H1.882Z"/></svg>'
    },
    {
      n: 'Audiomack',
      url: 'https://audiomack.com/aunysillyme-69e90d000942a',
      c: '#FF6A00',
      svg: '<svg viewBox="0 0 24 24" width="24" height="24" fill="#FF6A00"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 19.2c-3.975 0-7.2-3.225-7.2-7.2S8.025 4.8 12 4.8s7.2 3.225 7.2 7.2-3.225 7.2-7.2 7.2zm0-11.4c-2.32 0-4.2 1.88-4.2 4.2s1.88 4.2 4.2 4.2 4.2-1.88 4.2-4.2-1.88-4.2-4.2-4.2zm0 5.4c-.663 0-1.2-.537-1.2-1.2s.537-1.2 1.2-1.2 1.2.537 1.2 1.2-.537 1.2-1.2 1.2z"/></svg>'
    },
    {
      n: 'Suno',
      url: 'https://suno.com/@aunysillyme',
      c: '#FF7A1F',
      svg: '<svg viewBox="0 0 24 24" width="24" height="24"><defs><linearGradient id="sunoGrad" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#FFB300"/><stop offset="0.5" stop-color="#FF7A1F"/><stop offset="1" stop-color="#FB3878"/></linearGradient></defs><path fill="url(#sunoGrad)" d="M16.5 0C20.642 0 24 5.373 24 12h-9c0 6.627-3.358 12-7.5 12C3.358 24 0 18.627 0 12h9c0-6.627 3.358-12 7.5-12Z"/></svg>'
    },
  ];

  // Build orbit container
  var orbit = document.getElementById('orbit');
  orbit.style.width    = W + 'px';
  orbit.style.height   = W + 'px';
  orbit.style.position = 'relative';

  function makeRing(r, cls) {
    var d = document.createElement('div');
    d.className = 'ring-track ' + cls;
    d.style.width  = (r * 2) + 'px';
    d.style.height = (r * 2) + 'px';
    d.style.left   = (CX - r) + 'px';
    d.style.top    = (CY - r) + 'px';
    orbit.appendChild(d);
  }
  makeRing(IR, 'ring-inner');
  makeRing(OR, 'ring-outer');

  // Vinyl (spinning grooves)
  var vsz = 100;
  var vWrap = document.createElement('div');
  vWrap.className = 'vinyl-wrap';
  vWrap.style.cssText = 'width:' + vsz + 'px;height:' + vsz + 'px;margin-left:' + (-(vsz/2)) + 'px;margin-top:' + (-(vsz/2)) + 'px;top:50%;left:50%;';
  vWrap.innerHTML = '<svg viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="49" fill="#0a0a10"/><circle cx="50" cy="50" r="46" fill="none" stroke="#161620" stroke-width="1.5"/><circle cx="50" cy="50" r="42" fill="none" stroke="#111118" stroke-width="1"/><circle cx="50" cy="50" r="38" fill="none" stroke="#161620" stroke-width="1.5"/><circle cx="50" cy="50" r="34" fill="none" stroke="#111118" stroke-width="1"/><circle cx="50" cy="50" r="30" fill="none" stroke="#161620" stroke-width="1"/><circle cx="50" cy="50" r="25" fill="none" stroke="#FF6B1A" stroke-width="0.8" opacity="0.32"/><circle cx="50" cy="50" r="21" fill="#0a0a10"/><circle cx="50" cy="50" r="18" fill="none" stroke="#FF6B1A" stroke-width="1.5" opacity="0.7"/></svg>';
  orbit.appendChild(vWrap);

  // PFP — sits below vinyl (z-index 8), shows through transparent vinyl center
  var pfpSize = 34;
  var pfpWrap = document.createElement('div');
  pfpWrap.style.position        = 'absolute';
  pfpWrap.style.top             = '50%';
  pfpWrap.style.left            = '50%';
  pfpWrap.style.width           = pfpSize + 'px';
  pfpWrap.style.height          = pfpSize + 'px';
  pfpWrap.style.marginLeft      = -(pfpSize / 2) + 'px';
  pfpWrap.style.marginTop       = -(pfpSize / 2) + 'px';
  pfpWrap.style.borderRadius    = '50%';
  pfpWrap.style.overflow        = 'hidden';
  pfpWrap.style.zIndex          = '8';
  pfpWrap.style.backgroundColor = '#1a0a00';
  pfpWrap.style.backgroundSize  = 'cover';
  pfpWrap.style.backgroundPosition = 'center top';
  orbit.appendChild(pfpWrap);

  var pfpPaths = ['/images/auny-pfp-5.png'];
  (function tryPfp(i) {
    if (i >= pfpPaths.length) return;
    var t = new Image();
    t.onload = function () {
      pfpWrap.style.backgroundImage = 'url(' + pfpPaths[i] + ')';
    };
    t.onerror = function () { tryPfp(i + 1); };
    t.src = pfpPaths[i];
  })(0);

  // Planet factory
  function makePlanet(p) {
    var a = document.createElement('a');
    a.href   = p.url;
    a.target = '_blank';
    a.rel    = 'noopener noreferrer';
    a.className = 'planet';
    a.setAttribute('aria-label', p.n);
    a.innerHTML =
      '<div class="planet-icon" style="width:' + ICON + 'px;height:' + ICON + 'px;border:1.5px solid ' + p.c + ';box-shadow:0 0 14px ' + p.c + '60,inset 0 0 22px ' + p.c + '35;">' + p.svg + '</div>' +
      '<span class="planet-name" style="color:' + p.c + ';">' + p.n + '</span>';
    orbit.appendChild(a);
    return a;
  }

  var innerEls = SOCIALS.map(makePlanet);
  var outerEls = STREAMING.map(makePlanet);

  // Animation loop
  var innerAngle = 0;
  var outerAngle = Math.PI / 8;
  var last = null;

  function tick(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;

    innerAngle -= dt * (2 * Math.PI / 38);
    outerAngle += dt * (2 * Math.PI / 54);

    innerEls.forEach(function (el, i) {
      var a = innerAngle + (i / innerEls.length) * 2 * Math.PI;
      el.style.left = (CX + IR * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + IR * Math.sin(a) - HALF) + 'px';
    });

    outerEls.forEach(function (el, i) {
      var a = outerAngle + (i / outerEls.length) * 2 * Math.PI;
      el.style.left = (CX + OR * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + OR * Math.sin(a) - HALF) + 'px';
    });

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

})();
</script>
