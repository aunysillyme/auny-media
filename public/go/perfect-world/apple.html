     route: her ads are promoted organic posts, so X SCRAPES the link card and a

<meta property="og:image" content="https://www.auny.media/album-art/singles/perfect-world.jpg">

<!-- These pages exist to measure a click and hand it on. They must never be
     indexed, never enter the sitemap, and never compete with the real release
     page for the same query. -->

<link rel="canonical" href="https://www.auny.media/singles/perfect-world">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #E8912C; --bg: #07070a; --fg: #f4f4f6; --dim: #9a9aa6; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; align-items: center; justify-content: center;

  .cover {

  }

  .sub { color: var(--dim); font-size: 0.8rem; letter-spacing: 0.04em; margin-bottom: 1.75rem; }
  .cta {
    display: inline-block; width: 100%; padding: 0.9rem 1.25rem;
    background: var(--accent); color: #07070a; text-decoration: none;
    font-family: 'Outfit', system-ui, sans-serif; font-weight: 700;

<body>
  <main class="wrap">
    <div class="cover"><img src="/album-art/singles/perfect-world.jpg" alt="Perfect World cover art by Auny" width="192" height="192"></div>
    <h1>Perfect World</h1>
    <p class="sub">opening Apple Music</p>

    <!-- rel="noopener" ONLY. Adding noreferrer strips the origin and kills
         auny.media attribution inside Spotify for Artists / partner reporting.
         Canon: 🌐 auny.media/site_architecture.md, "Gotchas worth remembering". -->
    <a class="cta" id="go" href="https://music.apple.com/us/album/perfect-world/6810355910" rel="noopener">open Apple Music →</a>

    <a class="back" href="/singles/perfect-world">or see the full release page</a>
  </main>

<script>
  // The pixel is async. Redirecting on load would race uwt.js and the click
  // would go unrecorded, which is the exact silent failure that made Cloudflare
  // Web Analytics report zero for weeks (⚙️ SEO Settings/aunymedia/manifest.md).
  // So: hand the visitor a real button immediately, and auto-forward only after
  // the tag has had time to fire. Anyone impatient clicks through and the
  // pageview request has already gone out.
  (function () {
    var dest = document.getElementById('go').href;
    setTimeout(function () { window.location.replace(dest); }, 1800);
  })();
</script>
</body>
