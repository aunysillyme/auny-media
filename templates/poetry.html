<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{GA_HEAD}}
<!-- HELD: scaffold not yet launched — keep noindex until real pieces land. -->
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} — Poetry by Auny</title>
<meta name="description" content="{{TITLE}} — a spoken-word piece by Auny. {{BLURB}}">
<meta property="og:type" content="video.other">
<meta property="og:title" content="{{TITLE}} — Poetry by Auny">
<meta property="og:description" content="{{BLURB}}">
<meta property="og:image" content="https://www.auny.media{{POSTER}}">
<meta property="og:url" content="https://www.auny.media/poetry/{{SLUG}}">
<link rel="canonical" href="https://www.auny.media/poetry/{{SLUG}}">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preload" href="/fonts/outfit-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--accent:{{ACCENT_COLOR}};--accent-rgb:{{ACCENT_RGB}};--nav-accent:{{ACCENT_COLOR}}}
  html,body{min-height:100%;background:#030308;color:#fff;font-family:'Space Mono',monospace;overflow-x:hidden}
  .stage-bg{position:fixed;inset:0;z-index:0;background:url('{{POSTER}}') center/cover no-repeat;opacity:.30;filter:saturate(.7) blur(2px)}
  .stage-veil{position:fixed;inset:0;z-index:1;background:radial-gradient(120% 90% at 50% 38%,transparent 0%,rgba(3,3,8,.55) 55%,#030308 100%)}
  body::after{content:'';position:fixed;inset:0;z-index:60;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.10) 3px 4px);opacity:.16}
{{NAV_CSS}}
  .back{position:relative;z-index:20;display:inline-flex;align-items:center;gap:8px;margin:14px 0 0 40px;padding:7px 14px;border-radius:8px;
    background:rgba(3,3,8,.7);border:1px solid rgba(var(--accent-rgb),.3);color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.15em;
    text-transform:uppercase;text-decoration:none;backdrop-filter:blur(10px)}
  .back:hover{border-color:var(--accent)}
  .theater{position:relative;z-index:10;max-width:1180px;margin:0 auto;padding:18px 32px 80px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:var(--accent);opacity:.85;margin-bottom:18px}
  .piece-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(40px,6vw,82px);line-height:.95;letter-spacing:-2px;margin-bottom:6px;text-shadow:0 0 70px rgba(var(--accent-rgb),.4)}
  .piece-meta{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:30px}
  .piece-meta b{color:var(--accent);font-weight:400}
  .screen{position:relative;width:min(100%,780px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(var(--accent-rgb),.25),0 0 90px rgba(var(--accent-rgb),.22),0 30px 80px rgba(0,0,0,.6)}
  .screen img,.screen video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85)}
  .screen::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(3,3,8,.6) 100%)}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:84px;height:84px;border-radius:50%;
    background:rgba(var(--accent-rgb),.18);border:1.5px solid var(--accent);backdrop-filter:blur(6px);display:grid;place-items:center;box-shadow:0 0 40px rgba(var(--accent-rgb),.5)}
  .play svg{width:34px;height:34px;margin-left:5px;fill:#fff}
  .play.locked{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);box-shadow:none}
  .play.locked svg{fill:rgba(255,255,255,.7)}
  .cc{position:absolute;left:16px;bottom:14px;z-index:3;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 8px}
  .soon-note{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .caption{font-family:'Patrick Hand',cursive;font-size:clamp(22px,2.6vw,36px);line-height:1.3;color:#fff;margin:34px auto 0;max-width:640px;text-shadow:0 0 30px rgba(var(--accent-rgb),.3)}
  .caption .dim{opacity:.32}
  .program{position:relative;display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin-top:50px;padding-top:26px;border-top:1px solid rgba(255,255,255,.08);width:100%;max-width:760px}
  .prog-label{position:absolute;left:50%;transform:translateX(-50%);top:-9px;background:#050509;padding:0 14px;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.4)}
  .prog{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.62;transition:opacity .2s;text-decoration:none;color:inherit}
  .prog:hover{opacity:1}
  .prog .n{font-size:10px;letter-spacing:2px;color:var(--accent)}
  .prog .t{font-family:'Outfit',sans-serif;font-weight:700;font-size:15px}
  .prog .d{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.4)}
  {{FOOTER_CSS}}
</style>
</head>
<body>
<div class="stage-bg"></div><div class="stage-veil"></div>

{{NAV}}
<a class="back" href="/poetry">← &nbsp; poetry</a>

<main class="theater">
  <p class="eyebrow">✦ &nbsp; poetry · {{KIND}}</p>
  <h1 class="piece-title">{{TITLE}}</h1>
  <p class="piece-meta">{{KIND}} &nbsp;·&nbsp; <b>{{DURATION}}</b> &nbsp;·&nbsp; {{META_SUFFIX}}</p>
  {{SCREEN}}
  <p class="caption">{{CAPTION}}</p>
  {{PROGRAM}}
</main>

{{FOOTER_HTML}}
</body>
</html>
